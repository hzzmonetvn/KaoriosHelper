name: KaoriosHelper CI

on:
  workflow_dispatch:
  push:
    branches: [ main, master, 'refactor/**', 'hzzmonetvn/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-host:
    name: Host Tests (Rust Workspace & Python)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up Python
        run: |
          sudo apt-get update
          sudo apt-get install -y python3

      - name: Run Rust Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust Workspace Tests
        run: cargo test --workspace

      - name: Build helperctl (test-faults) & Run Python Management Test Suite
        run: |
          cargo build -p helperctl --features test-faults
          PYTHONPATH=. python3 -m unittest discover -s tests -p "test_*.py"

      - name: Check Rust Formatting
        continue-on-error: true
        run: cargo fmt --all -- --check

  build-android:
    name: Android Multi-ABI Rust Cross-Compilation & Packaging
    needs: test-host
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain (Android Targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platforms;android-34'

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build HMA DEX Payload
        run: |
          chmod +x dex/build_dex.sh
          bash dex/build_dex.sh

      - name: Cross-Compile Rust Multi-ABI Libraries & CLI
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          chmod +x scripts/build_android.sh
          bash scripts/build_android.sh all

      - name: Package Module ZIP
        run: |
          python3 scripts/package_module.py

      - name: Run Artifact Integration Tests
        run: |
          PYTHONPATH=. python3 -m unittest discover -s tests -p "test_*.py"

      - name: Verify ELFs, Packaging & Generate Status Report
        run: |
          python3 scripts/verify_artifacts.py

      - name: Record dependency and license acceptance
        id: acceptance
        continue-on-error: true
        run: python3 scripts/upstreams.py acceptance

      - name: Upload Diagnostic Module Artifact
        uses: actions/upload-artifact@v4
        with:
          # Build evidence only; release distribution requires acceptance below.
          name: kaorioshelper-diagnostic-module
          path: out/*.zip
          if-no-files-found: error

      - name: Upload Release-Accepted Module Artifact
        if: steps.acceptance.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kaorioshelper-flashable-module
          path: out/*.zip
          if-no-files-found: error
